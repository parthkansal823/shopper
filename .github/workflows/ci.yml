# Runs the end-to-end suite on every push and pull request.
#
# The smoke test drives the real app against a real MongoDB — nothing is
# mocked — so CI needs a database. A service container gives each run a
# throwaway one, which is also why the suite can safely drop its database on
# startup here.
#
# The frontend job only builds. A build failure catches the class of mistake
# that actually breaks deploys: an unresolved import (a new component that was
# never committed), or a syntax error Vite refuses.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongo:
        image: mongo:7
        ports:
          - 27099:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches PYTHON_VERSION in backend/render.yaml — CI should run what
          # production runs.
          python-version: "3.12.6"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the end-to-end suite
        working-directory: backend
        env:
          SMOKE_MONGODB_URI: mongodb://127.0.0.1:27099
          SMOKE_MONGODB_DB: shopper_ci
        run: python scripts/smoke_test.py

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches NODE_VERSION in frontend/netlify.toml.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # Netlify supplies the real value; any absolute URL proves the build
        # resolves and inlines it.
        env:
          VITE_API_URL: https://example.invalid
        run: npm run build
