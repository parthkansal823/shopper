<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Booking flow: pick a time, enter details, verify by one-time code, then confirm. Four gates protect a slot from being double-booked.">
  <title>Booking flow and the four conflict gates</title>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8b96"/>
    </marker>
    <style>
      .lbl  { font-size: 13px; font-weight: 650; fill: #e8e8ea; }
      .sub  { font-size: 11px; fill: #a9a9b4; }
      .tag  { font-size: 10px; font-weight: 600; fill: #7f7f8c; letter-spacing: .08em; }
      .num  { font-size: 12px; font-weight: 700; fill: #101014; }
      .edge { stroke: #8b8b96; stroke-width: 1.4; fill: none; marker-end: url(#a2); }
      .box  { fill: #1b1b20; stroke: #34343d; stroke-width: 1.2; rx: 10; }
      .gate { fill: #17171c; stroke: #3d3d47; stroke-width: 1.2; rx: 8; }
      .dot  { fill: #e8e8ea; }
      .warn { fill: #e0a94a; }
    </style>
  </defs>

  <rect width="900" height="400" fill="#101014"/>

  <text class="tag" x="24" y="34">INVITEE JOURNEY</text>

  <!-- Step 1 -->
  <rect class="box" x="24" y="50" width="196" height="72"/>
  <circle class="dot" cx="46" cy="74" r="10"/>
  <text class="num" x="43" y="78">1</text>
  <text class="lbl" x="64" y="78">Pick a time</text>
  <text class="sub" x="40" y="100">Days with no openings are</text>
  <text class="sub" x="40" y="114">greyed out before clicking.</text>

  <!-- Step 2 -->
  <rect class="box" x="248" y="50" width="196" height="72"/>
  <circle class="dot" cx="270" cy="74" r="10"/>
  <text class="num" x="267" y="78">2</text>
  <text class="lbl" x="288" y="78">Your details</text>
  <text class="sub" x="264" y="100">Name, email, and any</text>
  <text class="sub" x="264" y="114">custom questions.</text>

  <!-- Step 3 -->
  <rect class="box" x="472" y="50" width="196" height="72"/>
  <circle class="dot" cx="494" cy="74" r="10"/>
  <text class="num" x="491" y="78">3</text>
  <text class="lbl" x="512" y="78">Verify email</text>
  <text class="sub" x="488" y="100">6-digit code, asked once</text>
  <text class="sub" x="488" y="114">at the confirm step.</text>

  <!-- Step 4 -->
  <rect class="box" x="696" y="50" width="180" height="72"/>
  <circle class="dot" cx="718" cy="74" r="10"/>
  <text class="num" x="715" y="78">4</text>
  <text class="lbl" x="736" y="78">Confirmed</text>
  <text class="sub" x="712" y="100">Email with a private</text>
  <text class="sub" x="712" y="114">reschedule/cancel link.</text>

  <path class="edge" d="M222 86 L244 86"/>
  <path class="edge" d="M446 86 L468 86"/>
  <path class="edge" d="M670 86 L692 86"/>

  <!-- Gates -->
  <text class="tag" x="24" y="182">WHAT PROTECTS A SLOT — four gates, because each alone has a hole</text>

  <rect class="gate" x="24" y="198" width="204" height="88"/>
  <text class="lbl" x="42" y="224">1 · Shopper bookings</text>
  <text class="sub" x="42" y="246">Busy spans every event</text>
  <text class="sub" x="42" y="260">type the host offers, so</text>
  <text class="sub" x="42" y="274">09:00 is taken everywhere.</text>

  <rect class="gate" x="248" y="198" width="204" height="88"/>
  <text class="lbl" x="266" y="224">2 · External calendar</text>
  <text class="sub" x="266" y="246">Google freeBusy hides</text>
  <text class="sub" x="266" y="260">overlapping slots.</text>
  <text class="sub" x="266" y="274" fill="#e0a94a">Fails open if unreachable.</text>

  <rect class="gate" x="472" y="198" width="204" height="88"/>
  <text class="lbl" x="490" y="224">3 · Daily cap</text>
  <text class="sub" x="490" y="246">Closes the day once full.</text>
  <text class="sub" x="490" y="260">Counted in the host's</text>
  <text class="sub" x="490" y="274">timezone, per event type.</text>

  <rect class="gate" x="696" y="198" width="180" height="88"/>
  <text class="lbl" x="714" y="224">4 · Unique index</text>
  <text class="sub" x="714" y="246">Settles the race two</text>
  <text class="sub" x="714" y="260">simultaneous requests</text>
  <text class="sub" x="714" y="274">create. Loser gets 409.</text>

  <!-- Footnote -->
  <text class="sub" x="24" y="326">Gates 1–3 decide which slots are *offered*; only gate 4 can decide a tie at the moment of writing —</text>
  <text class="sub" x="24" y="342">the application check and the insert are not atomic, so two requests can both pass it.</text>
  <text class="sub" x="24" y="368">The index is partial on status: "confirmed", so cancelling a booking releases the slot again.</text>
</svg>
