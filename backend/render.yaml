# Render blueprint for the Shopper API.
#
# The database is MongoDB Atlas, not a Render-managed Postgres instance, so
# there is deliberately no `databases:` block here — provide MONGODB_URI as a
# secret instead. Values marked `sync: false` must be filled in from the
# Render dashboard (Environment tab) and are never committed.

services:
  - type: web
    name: shopper-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Shopper API
      - key: DEBUG
        value: "false"
      - key: SEED_ON_STARTUP
        value: "false"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata

      # ----- MongoDB Atlas -----
      # mongodb+srv://<user>:<password>@<cluster>/?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: shopper_prod

      # ----- Public URLs -----
      # FRONTEND_URL builds the invitee reschedule/cancel links that go out in
      # emails; API_PUBLIC_URL builds the iCal subscription URL. Both must be
      # the real public origins, with no trailing slash.
      - key: FRONTEND_URL
        value: https://shopper-ap823.netlify.app
      - key: API_PUBLIC_URL
        value: https://shopper-backend-mqcf.onrender.com
      - key: CORS_ORIGINS
        value: https://shopper-ap823.netlify.app

      # ----- Auth -----
      # Generate once and paste into the dashboard:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      # Startup refuses to boot in production if this is missing or short.
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOW_REGISTRATION
        value: "true"

      # ----- Google OAuth (optional; leave unset to hide the button) -----
      # Sign-in and calendar sync are separate grants — register BOTH redirect
      # URIs in the Google console or the flow fails with redirect_uri_mismatch.
      # Calendar sync needs the client secret to refresh tokens offline.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://shopper-backend-mqcf.onrender.com/api/auth/google/callback
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        value: https://shopper-backend-mqcf.onrender.com/api/auth/google/calendar/callback
      - key: GOOGLE_GMAIL_REDIRECT_URI
        value: https://shopper-backend-mqcf.onrender.com/api/auth/google/gmail/callback

      # ----- SMTP (required for OTP and notification email) -----
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: Shopper
      - key: SMTP_TIMEOUT_SECONDS
        value: "10"
      - key: SMTP_RETRY_COUNT
        value: "1"

      # ----- HTTPS email API -----
      # Render blocks outbound SMTP on the free tier, so SMTP_* alone will time
      # out here even though it works locally. Set one of these to send over
      # 443 instead; either takes precedence over SMTP_*.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # ----- Reminder scheduler -----
      - key: REMINDER_SCHEDULER_ENABLED
        value: "true"
      - key: REMINDER_POLL_SECONDS
        value: "60"

      # ----- OTP / rate limits -----
      - key: OTP_TTL_SECONDS
        value: "600"
      - key: OTP_RATE_LIMIT_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: VERIFICATION_TOKEN_TTL_SECONDS
        value: "900"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_LOGIN
        value: "10"
      - key: RATE_LIMIT_LOGIN_WINDOW
        value: "300"
      - key: RATE_LIMIT_BOOKING
        value: "10"
      - key: RATE_LIMIT_BOOKING_WINDOW
        value: "3600"
      - key: RATE_LIMIT_OTP
        value: "8"
      - key: RATE_LIMIT_OTP_WINDOW
        value: "3600"
