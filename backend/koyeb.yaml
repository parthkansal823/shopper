# Alternative deployment target. The primary target is Render
# (see render.yaml); this is kept in sync so it isn't a trap if you switch.
#
# The database is MongoDB Atlas — provide MONGODB_URI as a Koyeb secret.
# Values below marked `secret:` must exist in your Koyeb secret store.

name: shopper-backend
services:
  - name: api
    type: web
    git:
      branch: main
      build_command: pip install -r requirements.txt
      run_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
      workdir: backend
    instance_type: free
    regions:
      - fra
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    health_checks:
      - http:
          port: 8000
          path: /health
    env:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SEED_ON_STARTUP
        value: "false"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata

      - key: MONGODB_URI
        secret: mongodb-uri
      - key: MONGODB_DB_NAME
        value: shopper_prod

      - key: SECRET_KEY
        secret: secret-key
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOW_REGISTRATION
        value: "true"

      - key: CORS_ORIGINS
        secret: cors-origins
      - key: FRONTEND_URL
        secret: frontend-url
      - key: API_PUBLIC_URL
        secret: api-public-url

      # Optional. Sign-in and calendar sync are separate grants: register both
      # redirect URIs in the Google console. Omit all four to disable Google.
      - key: GOOGLE_CLIENT_ID
        secret: google-client-id
      - key: GOOGLE_CLIENT_SECRET
        secret: google-client-secret
      - key: GOOGLE_REDIRECT_URI
        secret: google-redirect-uri
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        secret: google-calendar-redirect-uri

      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        secret: smtp-user
      - key: SMTP_PASS
        secret: smtp-pass
      - key: SMTP_FROM
        secret: smtp-from
      - key: SMTP_FROM_NAME
        value: Shopper
      - key: SMTP_TIMEOUT_SECONDS
        value: "10"
      - key: SMTP_RETRY_COUNT
        value: "1"

      # Use when the platform blocks outbound SMTP; sends over 443 instead and
      # takes precedence over SMTP_*. Only one is needed.
      - key: SENDGRID_API_KEY
        secret: sendgrid-api-key
      - key: RESEND_API_KEY
        secret: resend-api-key

      - key: REMINDER_SCHEDULER_ENABLED
        value: "true"
      - key: REMINDER_POLL_SECONDS
        value: "60"

      - key: OTP_TTL_SECONDS
        value: "600"
      - key: OTP_RATE_LIMIT_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: VERIFICATION_TOKEN_TTL_SECONDS
        value: "900"
      - key: RATE_LIMIT_ENABLED
        value: "true"
